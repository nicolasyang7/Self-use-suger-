name: sync-upstream-rules

on:
  schedule:
    - cron: '0 20 * * *'   # 04:00 CST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download upstream rules
        run: bash sync.sh
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: sync upstream rules $(date -u +%Y-%m-%d)"
            git push
          fi
